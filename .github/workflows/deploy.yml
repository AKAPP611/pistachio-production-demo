name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
          
      - name: Validate JSON files
        run: |
          echo "Validating JSON configuration files..."
          
          # Validate manifest.json
          if [ -f manifest.json ]; then
            echo "Validating manifest.json..."
            jq empty manifest.json || (echo "❌ manifest.json is not valid JSON" && exit 1)
            echo "✅ manifest.json is valid"
          fi
          
          # Validate data files if they exist
          if [ -d data ]; then
            echo "Validating data files..."
            for file in data/*.json; do
              if [ -f "$file" ]; then
                echo "Validating $file..."
                jq empty "$file" || (echo "❌ $file is not valid JSON" && exit 1)
                echo "✅ $file is valid"
              fi
            done
          else
            echo "ℹ️ No data directory found (will be created automatically)"
          fi
          
      - name: Check JavaScript syntax
        run: |
          echo "Checking JavaScript syntax..."
          
          # Check main JavaScript files if they exist
          if [ -d js ]; then
            for file in js/*.js; do
              if [ -f "$file" ]; then
                echo "Checking $file..."
                # Basic syntax check using node if available
                if command -v node &> /dev/null; then
                  node -c "$file" || (echo "❌ $file has syntax errors" && exit 1)
                  echo "✅ $file syntax is valid"
                else
                  echo "ℹ️ Node.js not available, skipping syntax check for $file"
                fi
              fi
            done
          else
            echo "ℹ️ No js directory found"
          fi
          
          # Check service worker
          if [ -f sw.js ]; then
            echo "Checking sw.js..."
            if command -v node &> /dev/null; then
              node -c sw.js || (echo "❌ sw.js has syntax errors" && exit 1)
              echo "✅ sw.js syntax is valid"
            else
              echo "ℹ️ Node.js not available, skipping syntax check for sw.js"
            fi
          else
            echo "ℹ️ No service worker found"
          fi
          
      - name: Verify required files
        run: |
          echo "Checking for required files..."
          
          # Check for main HTML file
          if [ -f index.html ]; then
            echo "✅ index.html found"
          else
            echo "❌ index.html is missing!" && exit 1
          fi
          
          # Check for manifest
          if [ -f manifest.json ]; then
            echo "✅ manifest.json found"
          else
            echo "⚠️ manifest.json is missing (PWA features will be disabled)"
          fi
          
          # Check for service worker
          if [ -f sw.js ]; then
            echo "✅ sw.js found"
          else
            echo "⚠️ sw.js is missing (offline features will be disabled)"
          fi
          
          # Check for JavaScript modules
          if [ -d js ]; then
            echo "✅ js directory found"
            
            required_js_files=("config.js" "github-auth.js" "github-storage.js" "offline-manager.js" "enhanced-app.js")
            missing_files=()
            
            for file in "${required_js_files[@]}"; do
              if [ -f "js/$file" ]; then
                echo "✅ js/$file found"
              else
                echo "❌ js/$file is missing!"
                missing_files+=("js/$file")
              fi
            done
            
            if [ ${#missing_files[@]} -gt 0 ]; then
              echo "Missing required JavaScript files: ${missing_files[*]}"
              exit 1
            fi
          else
            echo "❌ js directory is missing!" && exit 1
          fi
          
      - name: Create data directory structure
        run: |
          echo "Setting up data directory structure..."
          
          # Create data directory if it doesn't exist
          if [ ! -d data ]; then
            echo "Creating data directory..."
            mkdir -p data
          fi
          
          # Create initial data files if they don't exist
          if [ ! -f data/productions.json ]; then
            echo "Creating initial productions.json..."
            echo "[]" > data/productions.json
          fi
          
          if [ ! -f data/materials.json ]; then
            echo "Creating initial materials.json..."
            echo "[]" > data/materials.json
          fi
          
          if [ ! -f data/users.json ]; then
            echo "Creating initial users.json..."
            echo "{}" > data/users.json
          fi
          
          if [ ! -f data/config.json ]; then
            echo "Creating initial config.json..."
            cat > data/config.json << EOF
          {
            "version": "2.0.0",
            "createdAt": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "deployedBy": "GitHub Actions",
            "buildNumber": "${{ github.run_number }}"
          }
          EOF
          fi
          
          echo "✅ Data directory structure ready"
          
      - name: Build application
        run: |
          echo "Building application..."
          
          # Create build directory
          mkdir -p _site
          
          # Copy all necessary files to build directory (excluding _site itself)
          echo "Copying application files..."
          find . -maxdepth 1 -name "_site" -prune -o -name ".git" -prune -o -name ".github" -prune -o -type f -print0 | xargs -0 cp -t _site/
          
          # Copy directories we need (excluding problematic ones)
          if [ -d "js" ]; then
            echo "Copying js directory..."
            cp -r js _site/
          fi
          
          if [ -d "data" ]; then
            echo "Copying data directory..."
            cp -r data _site/
          fi
          
          if [ -d "css" ]; then
            echo "Copying css directory..."
            cp -r css _site/
          fi
          
          if [ -d "images" ]; then
            echo "Copying images directory..."
            cp -r images _site/
          fi
          
          if [ -d "icons" ]; then
            echo "Copying icons directory..."
            cp -r icons _site/
          fi
          
          # Alternative method if the above doesn't work
          if [ ! -f "_site/index.html" ]; then
            echo "Using alternative copy method..."
            rsync -av --exclude='_site' --exclude='.git' --exclude='.github' --exclude='node_modules' . _site/
          fi
          
          echo "✅ Build completed successfully"
          
      - name: Generate build info
        run: |
          cd _site
          cat > build-info.json << EOF
          {
            "buildTime": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "buildNumber": "${{ github.run_number }}",
            "commitSha": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "version": "2.0.0",
            "builtBy": "GitHub Actions"
          }
          EOF
          echo "✅ Build info generated"
          
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  # Deployment job
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      yaml- name: Deploy to GitHub Pages
  id: deployment
  uses: actions/deploy-pages@v3
  with:
    timeout: 600000
    error_count: 10
    reporting_interval: 5000
    token: ${{ github.token }}
        
      - name: Create deployment notification
        if: success()
        run: |
          echo "🚀 Deployment successful!"
          echo "Site URL: ${{ steps.deployment.outputs.page_url }}"
          
  # Health check job
  health-check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Wait for deployment
        run: sleep 30
        
      - name: Health check
        run: |
          echo "Performing health check..."
          
          SITE_URL="${{ needs.deploy.outputs.page_url }}"
          if [ -z "$SITE_URL" ]; then
            SITE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          fi
          
          echo "Checking site: $SITE_URL"
          
          # Check if site is accessible
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$SITE_URL" || echo "000")
          
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Site is accessible (HTTP $HTTP_STATUS)"
          else
            echo "❌ Site is not accessible (HTTP $HTTP_STATUS)"
            exit 1
          fi
          
          # Check if manifest.json is accessible
          MANIFEST_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${SITE_URL}manifest.json" || echo "000")
          
          if [ "$MANIFEST_STATUS" = "200" ]; then
            echo "✅ Manifest file is accessible (HTTP $MANIFEST_STATUS)"
          else
            echo "⚠️ Manifest file is not accessible (HTTP $MANIFEST_STATUS)"
          fi
          
          # Check if service worker is accessible
          SW_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${SITE_URL}sw.js" || echo "000")
          
          if [ "$SW_STATUS" = "200" ]; then
            echo "✅ Service worker is accessible (HTTP $SW_STATUS)"
          else
            echo "⚠️ Service worker is not accessible (HTTP $SW_STATUS)"
          fi
          
          echo "🎉 Health check completed successfully!"

  # Security scan job (for pull requests)
  security-scan:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Run security scan
        run: |
          echo "Running security scan..."
          
          # Check for common security issues
          echo "Checking for hardcoded secrets..."
          if grep -r -i "password\|secret\|token\|key" --include="*.js" --include="*.html" --exclude-dir=node_modules . | grep -v "your-oauth-app-client-id" | grep -v "YOUR-USERNAME"; then
            echo "⚠️ Potential hardcoded secrets found. Please review."
          else
            echo "✅ No hardcoded secrets detected"
          fi
          
          # Check for console.log statements
          echo "Checking for debug statements..."
          if grep -r "console\." --include="*.js" --exclude-dir=node_modules . | grep -v "console.log.*ServiceWorker" | grep -v "console.error" | grep -v "console.warn"; then
            echo "⚠️ Console statements found. Consider removing for production."
          else
            echo "✅ No problematic console statements found"
          fi
          
          echo "✅ Security scan completed"
