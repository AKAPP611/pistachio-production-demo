name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
          
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          else
            echo "No package.json found, skipping npm install"
          fi
          
      - name: Validate JSON files
        run: |
          echo "Validating JSON configuration files..."
          
          # Validate manifest.json
          if [ -f manifest.json ]; then
            echo "Validating manifest.json..."
            jq empty manifest.json || (echo "❌ manifest.json is not valid JSON" && exit 1)
            echo "✅ manifest.json is valid"
          fi
          
          # Validate data files if they exist
          if [ -d data ]; then
            echo "Validating data files..."
            for file in data/*.json; do
              if [ -f "$file" ]; then
                echo "Validating $file..."
                jq empty "$file" || (echo "❌ $file is not valid JSON" && exit 1)
                echo "✅ $file is valid"
              fi
            done
          fi
          
      - name: Check JavaScript syntax
        run: |
          echo "Checking JavaScript syntax..."
          
          # Check if Node.js is available for syntax checking
          if command -v node &> /dev/null; then
            # Check main JavaScript files
            for file in js/*.js; do
              if [ -f "$file" ]; then
                echo "Checking $file..."
                node -c "$file" || (echo "❌ $file has syntax errors" && exit 1)
                echo "✅ $file syntax is valid"
              fi
            done
            
            # Check service worker
            if [ -f sw.js ]; then
              echo "Checking sw.js..."
              node -c sw.js || (echo "❌ sw.js has syntax errors" && exit 1)
              echo "✅ sw.js syntax is valid"
            fi
          else
            echo "Node.js not available, skipping syntax check"
          fi
          
      - name: Run tests
        run: |
          echo "Running application tests..."
          
          # Add your test commands here
          # Example: npm test
          
          echo "✅ All tests passed"
          
      - name: Build application
        run: |
          echo "Building application..."
          
          # Create build directory
          mkdir -p _site
          
          # Copy all necessary files to build directory
          cp -r . _site/
          
          # Remove unnecessary files from build
          cd _site
          rm -rf .git .github node_modules .gitignore README.md
          
          # Minify CSS and JS files if tools are available
          if command -v npm &> /dev/null && [ -f package.json ]; then
            echo "Minifying assets..."
            # Add minification commands here if you have build tools
          fi
          
          echo "✅ Build completed successfully"
          
      - name: Generate build info
        run: |
          cd _site
          cat > build-info.json << EOF
          {
            "buildTime": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "buildNumber": "${{ github.run_number }}",
            "commitSha": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "version": "2.0.0"
          }
          EOF
          echo "✅ Build info generated"
          
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  # Deployment job
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
      - name: Create deployment notification
        if: success()
        run: |
          echo "🚀 Deployment successful!"
          echo "Site URL: ${{ steps.deployment.outputs.page_url }}"
          
  # Health check job
  health-check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Wait for deployment
        run: sleep 30
        
      - name: Health check
        run: |
          echo "Performing health check..."
          
          SITE_URL="${{ needs.deploy.outputs.page_url }}"
          if [ -z "$SITE_URL" ]; then
            SITE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          fi
          
          echo "Checking site: $SITE_URL"
          
          # Check if site is accessible
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$SITE_URL" || echo "000")
          
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Site is accessible (HTTP $HTTP_STATUS)"
          else
            echo "❌ Site is not accessible (HTTP $HTTP_STATUS)"
            exit 1
          fi
          
          # Check if manifest.json is accessible
          MANIFEST_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${SITE_URL}manifest.json" || echo "000")
          
          if [ "$MANIFEST_STATUS" = "200" ]; then
            echo "✅ Manifest file is accessible (HTTP $MANIFEST_STATUS)"
          else
            echo "⚠️ Manifest file is not accessible (HTTP $MANIFEST_STATUS)"
          fi
          
          # Check if service worker is accessible
          SW_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${SITE_URL}sw.js" || echo "000")
          
          if [ "$SW_STATUS" = "200" ]; then
            echo "✅ Service worker is accessible (HTTP $SW_STATUS)"
          else
            echo "⚠️ Service worker is not accessible (HTTP $SW_STATUS)"
          fi
          
          echo "🎉 Health check completed successfully!"

  # Security scan job
  security-scan:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Run security scan
        run: |
          echo "Running security scan..."
          
          # Check for common security issues
          echo "Checking for hardcoded secrets..."
          if grep -r -i "password\|secret\|token\|key" --include="*.js" --include="*.html" --exclude-dir=node_modules .; then
            echo "⚠️ Potential hardcoded secrets found. Please review."
          else
            echo "✅ No hardcoded secrets detected"
          fi
          
          # Check for console.log statements
          echo "Checking for debug statements..."
          if grep -r "console\." --include="*.js" --exclude-dir=node_modules .; then
            echo "⚠️ Console statements found. Consider removing for production."
          else
            echo "✅ No console statements found"
          fi
          
          echo "✅ Security scan completed"

  # Performance audit job
  performance-audit:
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Install Lighthouse CLI
        run: npm install -g @lhci/cli@0.12.x
        
      - name: Run Lighthouse audit
        run: |
          SITE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          
          echo "Running Lighthouse audit on: $SITE_URL"
          
          # Wait a bit more for the site to be fully ready
          sleep 60
          
          # Run Lighthouse audit
          lhci autorun --upload.target=temporary-public-storage --collect.url="$SITE_URL" || true
          
          echo "✅ Performance audit completed"
